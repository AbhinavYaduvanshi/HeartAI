# ==============================================================================
# HeartAI Nginx Reverse Proxy Configuration (Production Template)
# ==============================================================================
# Upstream routing:
# - API & ML Endpoints -> FastAPI on 127.0.0.1:8000
# - Web UI & WebSockets -> NiceGUI on 127.0.0.1:8080
# - Static Motion Assets -> Directly served from disk
# ==============================================================================

# Map for WebSocket connection upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name heartai-staging.internal heartai-staging.your-tailnet.ts.net your-domain.org www.your-domain.org _;

    # ACME Challenge for Let's Encrypt renewal (public setups)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Main Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name heartai-staging.internal heartai-staging.your-tailnet.ts.net your-domain.org www.your-domain.org _;

    # SSL / TLS Configuration (Canonical Certificate Path: Tailscale cert or Let's Encrypt)
    ssl_certificate /etc/heartai/certs/tls.crt;
    ssl_certificate_key /etc/heartai/certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' wss: https:;" always;

    # Client limits
    client_max_body_size 10M;

    # Static Assets Direct Delivery (Bypasses Python runtime)
    location /static/ {
        alias /opt/heartai/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # FastAPI Backend Routes (REST API, Health, ML Inference, OpenAPI docs)
    location ~ ^/(api|predict|health|model-info|docs|redoc|openapi.json) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_buffering on;
    }

    # NiceGUI Frontend & Interactive WebSockets (Root application)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
