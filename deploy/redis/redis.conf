# ==============================================================================
# HeartAI Redis Configuration (Dedicated Rate Limiter & Token Bucket Store)
# ==============================================================================

# Network Binding: Strictly local loopback
bind 127.0.0.1 ::1
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Process Management
daemonize no
supervised systemd
pidfile /var/run/redis/redis-server.pid
loglevel notice
logfile /var/log/redis/redis-server.log

# Memory Management (Capped for rate-limiting store)
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence (Rate limiting is ephemeral, lightweight RDB snapshotting enabled)
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /var/lib/redis
